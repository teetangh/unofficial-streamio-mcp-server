name: Release

on:
  push:
    branches: [main]

# release-please needs to push its release branch and open a PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only on the push that merges a release PR, i.e. the commit that was
  # just tagged. Everything is re-verified before anything reaches npm.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the short-lived OIDC token npm exchanges for publish rights.
      # Without it, `npm publish` falls back to looking for a token.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships a new enough npm,
      # but pinning makes the requirement explicit rather than incidental.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run docs:check
      - run: npm run smoke

      # No NPM_TOKEN. Authentication is the OIDC token above, and npm attaches
      # a provenance attestation automatically for public packages built here.
      - name: Publish to npm
        run: npm publish
