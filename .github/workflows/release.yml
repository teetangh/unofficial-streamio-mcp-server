name: Release

on:
  push:
    branches: [main]
  # Recovery path: republish the current main without cutting a new version,
  # e.g. after a transient registry failure or a misconfigured publisher.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current main to npm (runs from main regardless of the branch selected)
        type: boolean
        default: false

# release-please needs to push its release branch and open a PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only on the push that merges a release PR, i.e. the commit that was
  # just tagged. Everything is re-verified before anything reaches npm.
  publish:
    needs: release-please
    # A manual run can select any ref, and checkout would honour it — so a
    # dispatch from an arbitrary branch could publish arbitrary code under this
    # package name. Manual publishing is pinned to the default branch.
    if: >-
      needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the short-lived OIDC token npm exchanges for publish rights.
      # Without it, `npm publish` falls back to looking for a token.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Never the dispatch-selected ref.
          ref: main

      # `registry-url` is deliberately omitted. It makes setup-node write an
      # .npmrc containing `_authToken=${NODE_AUTH_TOKEN}`; with no token set —
      # the expected state for trusted publishing — npm takes the classic-auth
      # path, never performs the OIDC handshake, and the registry rejects the
      # PUT as anonymous with a misleading 404.
      # https://github.com/actions/setup-node/issues/1551
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships a new enough npm,
      # but pinning makes the requirement explicit rather than incidental.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run docs:check
      - run: npm run smoke

      # No NPM_TOKEN. Authentication is the OIDC token above, and npm attaches
      # a provenance attestation automatically for public packages built here.
      - name: Verify no token-based auth is configured
        run: |
          if npm config get //registry.npmjs.org/:_authToken | grep -qv '^undefined$'; then
            echo "An _authToken is configured; npm will use classic auth instead of OIDC." >&2
            exit 1
          fi
          echo "No _authToken configured — npm will use OIDC."

      - name: Publish to npm
        run: npm publish
