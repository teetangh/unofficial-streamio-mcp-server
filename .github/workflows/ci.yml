name: CI

on:
  push:
    branches: [main]
  # Every pull request, not just those targeting main, so stacked PRs are
  # checked too.
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Runtime floor is 22.12 (@stream-io/node-sdk >= 0.8); the lint step
        # needs 22.13+ because ESLint 10 does not support 22.12.
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Tool docs are in sync with the registry
        run: npm run docs:check

      - name: MCP stdio smoke test
        run: npm run smoke

  live-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Live integration tests
        env:
          STREAM_API_KEY: ${{ secrets.STREAM_API_KEY }}
          STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
        run: |
          if [ -z "$STREAM_API_KEY" ] || [ -z "$STREAM_API_SECRET" ]; then
            echo "Skipping live tests — STREAM_API_KEY/STREAM_API_SECRET secrets are not configured."
            exit 0
          fi
          npm run test:live
